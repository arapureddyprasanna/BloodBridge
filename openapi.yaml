        '401':
          description: Authentication required
        '404':
          description: Application profile not found
    patch:
      tags:
        - Profiles
      summary: Update the current user's basic profile
      description: Updates editable profile fields without allowing role or account status changes.
      security:
        - FirebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: Profile updated successfully
        '400':
          description: Invalid profile data
        '401':
          description: Authentication required

